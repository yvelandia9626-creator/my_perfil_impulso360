
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMPULSO360 | Historial</title>
<link rel="stylesheet" href="historial.css">
</head>
<body>

<header>
    <h2>⚡ IMPULSO360</h2>
    <a href="dashboard.html">← Inicio</a>
</header>

<main>
    <h1>Historial de cotizaciones</h1>
    <p>Consulta las cotizaciones generadas.</p>

    <section class="panel">
        <input id="buscar" placeholder="Buscar por número o cliente">

        <table>
            <thead>
                <tr>
                    <th>Número</th>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Total</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="historial"></tbody>
        </table>
    </section>
</main>

<script src="historial.js"></script>
</body>
</html>
